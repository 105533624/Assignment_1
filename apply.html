<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
    <meta name="description" content="Apply.html">
    <meta name="keywords" content="HTML, Doctype, Head, Body, Meta, Paragraph, Headings, Strong, Emphasis">

    <link rel="stylesheet" href="styles.css">
    <title>Apply.html</title>
</head>
<header>
        <nav>
    <ul>
        <li><a href="index.html" title="Home Page">Home</a></li>
        <li><a href="jobs.html" title="Browse Careers">Jobs</a></li>
        <li><a href="apply.html" title="Submit Application">Apply</a></li>
        <li><a href="about.html" title="About the Team">About Us</a></li>
    </ul>
    </nav>
</header>
<body>
    <section class="form-section">
    <form class="form-container" method="post" action=" https://mercury.swin.edu.au/it000000/formtest.php">
        <fieldset>
            <legend>Job Application Details</legend>

            <label for="jobref">Job reference number</label>
            <input type="text" id="jobref" name="jobref" pattern="[a-zA-Z0-9]{5}" required title="Must be exactly 5 alphanumeric characters"><br><br>

            <label for="firstname">First name</label>
            <input type="text" id="firstname" name="firstname" pattern="[a-zA-Z]{1,20}" required><br><br>

            <label for="lastname">Last name</label>
            <input type="text" id="lastname" name="lastname" pattern="[a-zA-Z]{1,20}" required><br><br>

            <label for="date">Date of birth</label>
            <input type="date" id="date" name="date" required><br><br>
        </fieldset>
        <fieldset>
            <legend>Gender</legend>
            <input type="radio" id="male" name="male" required value="male">
            <label for="male">Man/Male</label>
            <input type="radio" id="female" name="female" required value="female">
            <label for="female">Woman/Female</label>
            <input type="radio" id="transgender" name="transgender" required value="transgender">
            <label for="transgender">Transgender</label>
            <input type="radio" id="Nonbinary" name="Nonbinary" required value="Nonbinary">
            <label for="Nonbinary">Non-binary</label>
        </fieldset>
        <label for="street">Street Address</label>
            <input type="text" id="street" name="street" pattern="[a-zA-Z]{1,40}" required><br><br>
         <label for="suburb">Suburb/Town</label>
            <input type="text" id="suburb" name="suburb" pattern="[a-zA-Z]{1,40}" required><br><br>
        <label for="state">State</label></label>
            <select id="state" name="state" required>
             <option value="">Please Select</option> 
             <option value="">VIC</option> 
             <option value="">NSW</option> 
             <option value="">QLD</option> 
             <option value="">NT</option> 
             <option value="">WA</option> 
             <option value="">SA</option> 
             <option value="">TAS</option> 
            <option value="">ACT</option>
            </select><br><br>
        <label for="postcode">Postcode</label>
            <input type="number" id="postcode" name="postcode" patten="{4}" required><br><br>
        <label for="email">Email</label>
            <input type="email" id="email" name="email" required title="Please enter an appropriate email address"><placeholder =@gmail.com></placeholder><br><br>
        <label for="phone">Phone number</label>
            <input type="tell" id="phone" name="phone" patten="{8,12}" required><br><br>
         <label for="skill">Skills list</label>
         <ul>
            <li>
                <input type="checkbox" id="html" name="skills[]" required>
                <label for="skill">HTML</label>
            </li>
             <li>
                <input type="checkbox" id="CSS" name="skills[]" required>
                <label for="skill">CSS</label>
            </li>
             <li>
                <input type="checkbox" id="Java" name="skills[]" required>
                <label for="skill">JavaScript</label>
            </li>
         </ul>   
         
            
        </form>
        </section>
</body>
</html>
